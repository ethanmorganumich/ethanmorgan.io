<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="corners"><rect width="64" height="64" rx="5"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd13d"/>
      <stop offset=".53" stop-color="#ff5737"/>
      <stop offset="1" stop-color="#6c3ce9"/>
    </linearGradient>
    <radialGradient id="warm" cx="15%" cy="10%" r="70%">
      <stop stop-color="#ffd13d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd13d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="100%" cy="100%" r="70%">
      <stop stop-color="#6c3ce9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6c3ce9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="64" height="64" fill="url(#base)"/>
    <rect width="64" height="64" fill="url(#warm)"/>
    <rect width="64" height="64" fill="url(#violet)"/>
  </g>
</svg>
