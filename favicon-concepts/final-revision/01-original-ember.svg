<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="corners"><rect width="64" height="64" rx="5"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffce3a"/>
      <stop offset=".53" stop-color="#ff652d"/>
      <stop offset="1" stop-color="#dc1838"/>
    </linearGradient>
    <radialGradient id="light" cx="12%" cy="8%" r="70%">
      <stop stop-color="#fff9bf" stop-opacity=".82"/>
      <stop offset="1" stop-color="#fff9bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="64" height="64" fill="url(#base)"/>
    <rect width="64" height="64" fill="url(#light)"/>
  </g>
</svg>
